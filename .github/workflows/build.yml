name: Build rustFrida KernelSU Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Checkout rustFrida
      uses: actions/checkout@v4
      with:
        repository: kkkbbb/rustFrida
        path: rustFrida-master
        submodules: recursive
    
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
      id: setup-ndk
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    
    - name: Setup Rust nightly for eBPF
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: aarch64-linux-android
        components: rust-src
    
    - name: Install bpf-linker
      run: cargo install bpf-linker
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Create NDK symlink
      run: |
        mkdir -p ~/Android/Sdk/ndk
        ln -s ${{ steps.setup-ndk.outputs.ndk-path }} ~/Android/Sdk/ndk/r25c
    
    - name: Fix cargo config
      run: |
        NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
        sed -i "s|/home/wwb/Android/Sdk/ndk/25.0.8775105|${NDK_PATH}|g" rustFrida-master/.cargo/config.toml
        # Remove problematic rustflags that reference non-existent clang_rt library
        sed -i '/^rustflags = /d' rustFrida-master/.cargo/config.toml
    
    - name: Build loader
      run: |
        export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
        export NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
        cd rustFrida-master/loader && python3 build_helpers.py
    
    - name: Build agent
      run: |
        export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
        export CC_aarch64_linux_android=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
        export AR_aarch64_linux_android=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        cd rustFrida-master && cargo build -p agent --release
    
    - name: Build rustfrida
      run: |
        export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
        export CC_aarch64_linux_android=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
        export AR_aarch64_linux_android=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        cd rustFrida-master && cargo build -p rust_frida --release
    
    - name: Build Web UI
      run: |
        export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
        export CC_aarch64_linux_android=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
        export AR_aarch64_linux_android=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
        cd webui && cargo build --release --target aarch64-linux-android
    
    - name: Package module
      run: |
        mkdir -p build/tmp/files
        cp -r base/* build/tmp/
        cp rustFrida-master/target/aarch64-linux-android/release/rustfrida build/tmp/files/
        cp webui/target/aarch64-linux-android/release/rustfrida-webui build/tmp/files/
        chmod +x build/tmp/files/rustfrida
        chmod +x build/tmp/files/rustfrida-webui
        cd build/tmp && zip -r ../rustFrida-KernelSU.zip . && cd ../..
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustFrida-KernelSU-Module
        path: build/rustFrida-KernelSU.zip
    
    - name: Release
      if: github.ref == 'refs/heads/master'
      continue-on-error: true
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v0.16.10-${{ github.run_number }}
        files: build/rustFrida-KernelSU.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
