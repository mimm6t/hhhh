name: Build rustFrida KernelSU Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Checkout rustFrida
      uses: actions/checkout@v4
      with:
        repository: suifei/rustFrida
        path: rustFrida-master
        submodules: recursive
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang lld
    
    - name: Build loader shellcode
      run: |
        cd rustFrida-master/loader
        python3 build_helpers.py
    
    - name: Build agent
      run: |
        cd rustFrida-master
        cargo build -p agent --release
    
    - name: Build rustfrida
      run: |
        cd rustFrida-master
        cargo build -p rust_frida --release
    
    - name: Package module
      run: |
        mkdir -p build/tmp
        cp -r base/* build/tmp/
        mkdir -p build/tmp/files
        cp rustFrida-master/target/aarch64-linux-android/release/rustfrida build/tmp/files/
        chmod +x build/tmp/files/rustfrida
        cd build/tmp
        zip -r ../rustFrida-KernelSU-0.16.10.zip .
        cd ../..
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustFrida-KernelSU-Module
        path: build/rustFrida-KernelSU-0.16.10.zip
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v0.16.10-${{ github.run_number }}
        name: rustFrida KernelSU v0.16.10-${{ github.run_number }}
        files: build/rustFrida-KernelSU-0.16.10.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
