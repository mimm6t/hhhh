[package]
name = "hide-my-applist-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
ctrlc = "3.4"
jni = { version = "0.21", optional = true }

[features]
default = []
android = ["jni"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hma-rust"
path = "src/bin/main.rs"

[[bin]]
name = "symbol-test"
path = "src/bin/symbol-test.rs"
