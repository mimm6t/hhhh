[package]
name = "hide-my-applist-rust"
version = "0.2.0"
edition = "2021"

[lib]
name = "hide_my_applist_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hma-rust"
path = "src/bin/main.rs"

[features]
default = []
android = ["jni", "frida-gum"]
frida = ["frida-gum"]

[dependencies]
# Core dependencies
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
log = "0.4"
env_logger = "0.11"

# Frida Hook Engine (using local path like rustFrida)
frida-gum = { path = "../rustFrida-master/frida-gum", features = ["invocation-listener", "interceptor"], optional = true }

# Android JNI
jni = { version = "0.21", optional = true }

# System calls
nix = "0.29"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[build-dependencies]
cc = "1.0"