<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rustFrida Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f5; }
        .header { background: #2196F3; color: white; padding: 15px 20px; }
        .tabs { display: flex; background: white; border-bottom: 1px solid #ddd; }
        .tab-btn { padding: 15px 20px; border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { border-bottom-color: #2196F3; color: #2196F3; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        .section { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; }
        .app-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .switch { position: relative; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(26px); }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #2196F3; color: white; }
        .btn-danger { background: #f44336; color: white; }
        textarea { width: 100%; height: 400px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header"><h1>🚀 rustFrida Manager</h1></div>
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('apps')">📱 应用</button>
        <button class="tab-btn" onclick="showTab('scripts')">📝 脚本</button>
        <button class="tab-btn" onclick="showTab('logs')">📊 日志</button>
    </div>
    <div id="apps-tab" class="tab-content active">
        <div class="section">
            <h2>应用列表</h2>
            <input type="text" id="search" placeholder="搜索..." onkeyup="filterApps()">
            <div id="app-list"></div>
        </div>
    </div>
    <div id="scripts-tab" class="tab-content">
        <div class="section">
            <h2>Hook 脚本</h2>
            <button class="btn btn-primary" onclick="newScript()">+ 新建</button>
            <div id="script-list" style="margin-top:15px;"></div>
        </div>
        <div id="editor" class="section" style="display:none;">
            <input type="text" id="name" placeholder="脚本名称">
            <textarea id="content"></textarea>
            <button class="btn btn-primary" onclick="save()">保存</button>
            <button class="btn" onclick="hideEditor()">取消</button>
        </div>
    </div>
    <div id="logs-tab" class="tab-content">
        <div class="section">
            <h2>实时日志</h2>
            <button class="btn" onclick="loadLogs()">刷新</button>
            <pre id="log-output" style="background:#1e1e1e;color:#d4d4d4;padding:15px;border-radius:4px;height:500px;overflow-y:auto;white-space:pre-wrap;font-family:monospace;font-size:12px;margin-top:10px;">加载中...</pre>
        </div>
    </div>
    <script>
        let apps=[], hooks={};
        function showTab(t){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));document.getElementById(t+'-tab').classList.add('active');event.target.classList.add('active');if(t==='apps')loadApps();if(t==='scripts')loadScripts();if(t==='logs')loadLogs();}
        async function loadApps(){const r=await fetch('/api/apps');apps=await r.json();const h=await fetch('/api/hooks');hooks=await h.json();renderApps();}
        function renderApps(){const s=document.getElementById('search').value.toLowerCase();const f=apps.filter(a=>a.package.toLowerCase().includes(s));document.getElementById('app-list').innerHTML=f.map(a=>`<div class="app-item"><div><div style="font-weight:500;">${a.name}</div><div style="font-size:12px;color:#666;">${a.package}</div></div><div><button class="btn" onclick="injectNow('${a.package}')" style="margin-right:10px;">💉 注入</button><label class="switch"><input type="checkbox" ${hooks.enabled&&hooks.enabled.includes(a.package)?'checked':''} onchange="toggle('${a.package}',this.checked)"><span class="slider"></span></label></div></div>`).join('');}
        function filterApps(){renderApps();}
        async function toggle(p,e){if(e){const s=prompt('脚本名称:','dingtalk-helper.js');if(!s)return;await fetch('/api/hook/enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({package:p,script:s})});}else{await fetch('/api/hook/disable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({package:p})});}loadApps();}
        async function loadScripts(){const r=await fetch('/api/scripts');const s=await r.json();document.getElementById('script-list').innerHTML=s.map(x=>`<div style="padding:10px;border:1px solid #ddd;margin:5px 0;"><span>${x.name}</span> <button class="btn" onclick="edit('${x.name}')">编辑</button> <button class="btn btn-danger" onclick="del('${x.name}')">删除</button></div>`).join('');}
        function newScript(){document.getElementById('name').value='';document.getElementById('content').value='';document.getElementById('editor').style.display='block';}
        async function edit(n){const r=await fetch('/api/script/'+n);const d=await r.json();document.getElementById('name').value=n;document.getElementById('content').value=d.content;document.getElementById('editor').style.display='block';}
        async function save(){const n=document.getElementById('name').value;const c=document.getElementById('content').value;await fetch('/api/script/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,content:c})});hideEditor();loadScripts();}
        async function del(n){if(!confirm('删除 '+n+'?'))return;await fetch('/api/script/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});loadScripts();}
        function hideEditor(){document.getElementById('editor').style.display='none';}
        async function loadLogs(){const r=await fetch('/api/output');const d=await r.json();document.getElementById('log-output').textContent=d.output||'暂无日志';}
        async function injectNow(p){const script=hooks.hooks&&hooks.hooks[p]||'dingtalk-helper.js';if(!confirm(`立即注入 ${p}?\n脚本: ${script}`))return;const r=await fetch('/api/inject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({package:p,script:script})});const d=await r.json();alert(d.success?'注入成功！查看日志标签':'注入失败: '+(d.error||'未知错误'));loadLogs();}
        loadApps();
        setInterval(loadLogs,3000);
    </script>
</body>
</html>
